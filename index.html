function rng(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1)),pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuf(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mcq(r,q,ans,sol,fmt,cands){
  fmt=fmt||(x=>String(x));const set=[];
  (cands||[]).forEach(c=>{if(c!==ans&&c>0&&!set.includes(c))set.push(c)});
  const st=Math.max(1,Math.round(ans/10));
  for(let n=1;set.length<3;n++){[ans+n*st,ans-n*st].forEach(c=>{if(set.length<3&&c>0&&c!==ans&&!set.includes(c))set.push(c)})}
  const o=shuf(r,[ans].concat(set.slice(0,3)));return [q,o.map(fmt),o.indexOf(ans),sol];
}

function parseQs(t){
  const out=[],L=t.split("\n").map(x=>x.trim()).filter(Boolean);
  for(let i=0;i<L.length;i++){
    const p=L[i].split("|").map(x=>x.trim());
    if(p.length<6)throw new Error(`Line ${i+1}: format hai  Sawal | A | B | C | D | Sahi | Solution`);
    const ai="ABCD".indexOf(p[5].toUpperCase().charAt(0)),an=ai>=0?ai:parseInt(p[5])-1;
    if(!(an>=0&&an<4))throw new Error(`Line ${i+1}: Sahi option A, B, C ya D likhein`);
    out.push([p[0],p.slice(1,5),an,p[6]||"—"]);
  }

}

function dayNo(off){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)-off}
function rot(a,k,c,z){const n=a.length,o=[];for(let t=0;t<c;t++){const p=k*c+t;o.push(a[shuf(rng(z+Math.floor(p/n)),a.map((_,i)=>i))[p%n]])}return o}
function makeTest(k){
  const r=rng(k*7919+13),out=[],u=new Set();
  const add=(L,c)=>{for(let g=0;c>0&&g<99;g++){const q=pick(r,L)(r);if(!u.has(q[0])){u.add(q[0]);out.push(q);c--}}};
  add(MG,10);add(RG,6);
  [["English",3,11],["GK",3,22],["Haryana GK",3,33]].forEach(([s,c,z])=>rot(Q[s],k,c,z).forEach(x=>out.push(x)));
  return shuf(r,out);
}
function dseed(off){const d=new Date();d.setDate(d.getDate()-off);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function dlabel(off){const d=new Date();d.setDate(d.getDate()-off);return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function gen(n,list){const r=rng(Date.now()%1000000),o=[];for(let i=0;i<n;i++)o.push(pick(r,list)(r));return o}
function home(){
  const all=Object.keys(Q).filter(k=>!["Maths","Reasoning"].includes(k)).reduce((a,k)=>a.concat(Q[k]),[]);
  view.innerHTML=`<div class="card"><h2>📅 Aaj ka Daily Mock Test</h2><div class="mut">Har din apne aap naya test banta hai (Maths, Reasoning, English, GK, Haryana GK – 25 sawal, roz naye, repeat nahi).</div><div id="d"></div><div class="mut" style="margin-top:8px">Pichhle din ke tests:</div><div id="pd"></div></div>
  <div class="card"><h2>Mock Tests 1–20</h2><div id="mt"></div></div>
  <div class="card"><h2>Subject-wise</h2><div class="mut">Maths aur Reasoning mein har baar naye sawal bante hain.</div><div id="sb"></div></div>`;
  if(CUSTOM.length){const c=document.createElement("div");c.className="card";c.innerHTML="<h2>📌 Naye Tests</h2>";CUSTOM.forEach(t=>{const b=document.createElement("button");b.textContent=`${t.title} (${t.qs.length} Q • ${t.date})`;b.onclick=()=>run(t.title,()=>t.qs.slice());c.appendChild(b)});view.insertBefore(c,view.firstChild)}
  const add=(id,t,fn,sm)=>{const b=document.createElement("button");b.textContent=t;if(sm)b.className="sm";b.onclick=fn;document.getElementById(id).appendChild(b)};
  add("d","Aaj ka Test ("+dlabel(0)+")",()=>run("Daily – "+dlabel(0),()=>makeTest(dayNo(0))));
  for(let i=1;i<=6;i++)add("pd",dlabel(i),()=>run("Daily – "+dlabel(i),()=>makeTest(dayNo(i))),1);
  for(let i=1;i<=20;i++)add("mt","Mock "+i,()=>run("Mock Test "+i,()=>makeTest(100000+i)),1);
  add("sb","Maths (20, naye)",()=>run("Maths",()=>gen(20,MG)));
  add("sb","Reasoning (15, naye)",()=>run("Reasoning",()=>gen(15,RG)));
  ["English","GK","Haryana GK"].forEach(k=>add("sb",`${k} (${Q[k].length})`,()=>run(k,()=>shuf(Math.random,Q[k]))));
  add("sb",`Full GK+English (${all.length})`,()=>run("Full Static",()=>shuf(Math.random,all)));
}
function run(name,fn){
  const qs=fn();let sc=0,done=0;
  view.innerHTML=`<div class="bar"><b>${esc(name)}</b><span id="st">0 / ${qs.length} • Sahi: 0</span></div><div id="qs"></div><div class="card" id="res" hidden></div><button id="hm" style="background:transparent;color:var(--pri);border:1px solid var(--pri)">← Wapas</button>`;
  document.getElementById("hm").onclick=home;
  const box=document.getElementById("qs"),st=document.getElementById("st");
  qs.forEach((m,i)=>{
    const c=document.createElement("div");c.className="card";c.innerHTML=`<b>Q${i+1}. ${esc(m[0])}</b>`;
    const ob=document.createElement("div");
    m[1].forEach((t,j)=>{
      const b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+j)+". "+t;
      b.onclick=()=>{
        if(c.dataset.d)return;c.dataset.d=1;done++;
        ob.children[m[2]].classList.add("ok");
        if(j===m[2])sc++;else b.classList.add("bad");
        const x=document.createElement("div");x.className="sol";x.textContent="Solution: "+m[3];c.appendChild(x);
        st.textContent=`${done} / ${qs.length} • Sahi: ${sc}`;
        if(done===qs.length){const r=document.getElementById("res");r.hidden=false;r.innerHTML=`<h2>Score: ${sc} / ${qs.length} (${Math.round(sc*100/qs.length)}%)</h2><button id="rt">Dobara</button>`;document.getElementById("rt").onclick=()=>run(name,fn);r.scrollIntoView({behavior:"smooth"})}
      };
      ob.appendChild(b);
    });
    c.appendChild(ob);box.appendChild(c);
  });
}

const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let CUSTOM=[];try{CUSTOM=JSON.parse(document.getElementById("cd").textContent)}catch(e){}
async function publishCustom(list){
  const art=await claude.use("artifact");if(!art)throw {code:"not_granted"};
  const tpl=document.getElementById("tpl").textContent;
  const raw=tpl.split("<\\/script>").join("<"+"/script>");
  const cd=JSON.stringify(list).split("<").join("\\u003c");
  const html=raw.split("@@"+"CD"+"@@").join(cd).split("@@"+"TPL"+"@@").join(tpl);
  await art.publish(html);
}
function parseQs(t){
  const out=[],L=t.split("\n").map(x=>x.trim()).filter(Boolean);
  for(let i=0;i<L.length;i++){
    const p=L[i].split("|").map(x=>x.trim());
    if(p.length<6)throw new Error(`Line ${i+1}: format hai  Sawal | A | B | C | D | Sahi | Solution`);
    const ai="ABCD".indexOf(p[5].toUpperCase().charAt(0)),an=ai>=0?ai:parseInt(p[5])-1;
    if(!(an>=0&&an<4))throw new Error(`Line ${i+1}: Sahi option A, B, C ya D likhein`);
    out.push([p[0],p.slice(1,5),an,p[6]||"—"]);
  }
  if(!out.length)throw new Error("Koi sawal nahi mila");return out;
}
function adminView(){
  view.innerHTML=`<div class="card"><h2>⚙ Admin – Naya Test jodein</h2><div class="mut">Har line mein ek sawal. Format:<br><code>Sawal | A | B | C | D | Sahi (A/B/C/D) | Solution</code></div>
  <input id="at" placeholder="Test ka naam (jaise: Daily Test 5 Oct)"><textarea id="aq" rows="9" placeholder="2+2 kitna hai? | 3 | 4 | 5 | 6 | B | 2+2 = 4"></textarea>
  <div class="err" id="ae"></div><button id="ap">Publish karein</button><button id="ab" style="background:transparent;color:var(--pri);border:1px solid var(--pri)">← Wapas</button></div>
  <div class="card"><h2>Admin ke tests</h2><div id="al"></div></div>`;
  document.getElementById("ab").onclick=home;
  const er=m=>document.getElementById("ae").textContent=m;
  const fail=e=>er(e&&e.code==="not_writer"?"Aap is page ke owner nahi hain.":e&&e.code==="conflict"?"":(e&&e.message)||"Publish nahi ho paya, dobara koshish karein.");
  document.getElementById("ap").onclick=async()=>{
    try{
      const t=document.getElementById("at").value.trim();if(!t)throw new Error("Test ka naam likhein");
      const qs=parseQs(document.getElementById("aq").value);
      er("Publish ho raha hai…");
      await publishCustom([{id:Date.now(),title:t,date:dlabel(0),qs}].concat(CUSTOM));
    }catch(e){fail(e)}
  };
  const al=document.getElementById("al");
  if(!CUSTOM.length)al.innerHTML='<span class="mut">Abhi koi test nahi.</span>';
  CUSTOM.forEach(t=>{
    const d=document.createElement("div");d.style.cssText="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0";
    d.innerHTML=`<span>${esc(t.title)} <span class="mut">(${t.qs.length} Q • ${esc(t.date)})</span></span>`;
    const b=document.createElement("button");b.className="sm";b.style.background="var(--bad)";b.textContent="Delete";
    b.onclick=async()=>{if(confirm("Ye test hata dein?")){try{await publishCustom(CUSTOM.filter(x=>x.id!==t.id))}catch(e){fail(e)}}};
    d.appendChild(b);al.appendChild(d);
  });
}
document.getElementById("adm").onclick=adminView;
(async()=>{try{if(!window.claude)return;const u=await claude.use("user"),a=await claude.use("artifact");if(u&&a&&await u.isOwner())document.getElementById("adm").hidden=false}catch(e){}})();
setTimeout(()=>{const sp=document.getElementById("splash");if(sp)sp.remove()},2800);
document.getElementById("splash").onclick=()=>document.getElementById("splash").remove();
</script>
